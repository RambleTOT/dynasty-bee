# Лимиты для api.bee-dynasty.ru — предложение бэку (docs/SECURITY.md, шаг 5).
# Зоны bd_api, bd_login, bd_write уже объявлены в bee-dynasty.conf (http-уровень), отдельно их
# объявлять не нужно. Строки ниже — в /etc/nginx/sites-available/api.bee-dynasty.conf, в server {} на 443:
#
#     server_tokens off;
#     limit_conn bd_conn 40;
#     limit_conn_status 429;
#     limit_req_status 429;
#     client_header_timeout 10s;
#     client_body_timeout 20s;
#
#     location = /api/v1/auth/login {
#         limit_req zone=bd_login burst=5 nodelay;
#         proxy_pass http://127.0.0.1:8000;
#         # … те же proxy_set_header, что в location /
#     }
#
# и в существующий location /:
#
#     limit_req zone=bd_api burst=40 nodelay;
#     limit_req zone=bd_write burst=20 nodelay;
#
# Проверка и применение: nginx -t && systemctl reload nginx
