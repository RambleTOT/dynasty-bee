# Фронтенд «Маршруты инженеров» на сервере бэка (рядом с api.bee-dynasty.conf, его не трогаем).
# Статика — /var/www/bee-dynasty/current (симлинк на последний релиз, см. scripts/deploy.sh).
# /api/ проксируется в тот же контейнер бэка, что и api.bee-dynasty.ru: один origin, CORS не нужен.
# :8443 и :9443 — тот же сайт отдельными origin'ами: можно держать три роли залогиненными одновременно.
# Защита от перегрузки и перебора — docs/SECURITY.md.

# --- лимиты на IP клиента (зоны http-уровня: файл подключается внутри http {}) ---
# все запросы к API; опрос дня — ~1 запрос в секунду на вкладку
limit_req_zone $binary_remote_addr zone=bd_api:10m rate=20r/s;
# вход: перебор паролей
limit_req_zone $binary_remote_addr zone=bd_login:10m rate=10r/m;
# изменения (POST/PATCH): многие запускают солвер — план, сравнение, событие, запись, импорт
map $request_method $bd_write_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}
limit_req_zone $bd_write_key zone=bd_write:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=bd_conn:10m;

# сокет живых обновлений: Connection: upgrade — только если клиент просит Upgrade
map $http_upgrade $bd_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream beeline_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# http → https; ACME-челленджи Let's Encrypt — из webroot
server {
    listen 80;
    listen [::]:80;
    server_name bee-dynasty.ru www.bee-dynasty.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://bee-dynasty.ru$request_uri;
    }
}

# www → основной домен
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bee-dynasty.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/bee-dynasty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bee-dynasty.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bee-dynasty.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name bee-dynasty.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/bee-dynasty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bee-dynasty.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bee-dynasty.access.log;
    error_log  /var/log/nginx/bee-dynasty.error.log;

    root /var/www/bee-dynasty/current;
    index index.html;

    # медленные клиенты (slowloris) и большие тела
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    # не больше 40 соединений с одного IP; превышение лимитов — 429
    limit_conn bd_conn 40;
    limit_conn_status 429;
    limit_req_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Заголовки безопасности — только здесь: add_header в location отменил бы их, поэтому кэш
    # в location ниже задаётся через expires. CSP: свои скрипты, шрифт Onest (Google Fonts),
    # тайлы OpenStreetMap, JavaScript API Яндекс Карт в режиме csp=true (lib/yandexMapsApi.ts)
    # и сокет живых обновлений на своих портах (wss://).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://suggest-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.maps.yandex.net https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yandex.ru; connect-src 'self' https://photon.komoot.io wss://bee-dynasty.ru wss://bee-dynasty.ru:8443 wss://bee-dynasty.ru:9443 https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://suggest-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru https://*.taxi.yandex.net; frame-src https://api-maps.yandex.ru; child-src https://api-maps.yandex.ru; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # скрытые файлы (.env, .git …) — сканеры получают 404, а не index.html
    location ~ /\. {
        return 404;
    }

    # вход — отдельный строгий лимит
    location = /api/v1/auth/login {
        limit_req zone=bd_login burst=5 nodelay;
        limit_req zone=bd_api burst=40 nodelay;
        proxy_pass http://beeline_api;
        include /etc/nginx/snippets/bee-dynasty-proxy.conf;
    }

    # живые обновления — WebSocket (docs/REALTIME.md, BACKEND_REQUESTS п. 38). Соединение долгое:
    # сервер шлёт ping раз в 25 с, поэтому час тишины бывает только у мёртвого клиента.
    location = /api/v1/realtime/ws {
        limit_req zone=bd_api burst=40 nodelay;
        proxy_pass http://beeline_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bd_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # загрузка CSV — тело побольше
    location = /api/v1/data/import-beeline {
        limit_req zone=bd_api burst=40 nodelay;
        limit_req zone=bd_write burst=20 nodelay;
        client_max_body_size 10m;
        proxy_pass http://beeline_api;
        include /etc/nginx/snippets/bee-dynasty-proxy.conf;
    }

    # API бэка — тот же сервер. DELETE фронт не использует — через этот вход закрыт.
    location /api/ {
        limit_except GET HEAD POST PATCH OPTIONS {
            deny all;
        }
        limit_req zone=bd_api burst=40 nodelay;
        limit_req zone=bd_write burst=20 nodelay;
        proxy_pass http://beeline_api;
        include /etc/nginx/snippets/bee-dynasty-proxy.conf;
    }

    # сборка Vite: имена с хешем — кэшируем надолго
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA: любой путь приложения → index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
