# Лимиты запросов для API-хоста (S4 из docs/BACKEND_REQUESTS2.md).
#
# Сайт ходит в API через свой домен, но порт API может быть открыт напрямую,
# поэтому лимиты нужны и на API-виртуалхосте. Подключение в конфиге nginx:
#
#   include /etc/nginx/snippets/api-limits.conf;
#
# Зоны: вход 10/мин на IP, прочие POST 60/мин на IP, общий фон 20 r/s на IP.

limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_post:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_all:10m   rate=20r/s;

# В server{...}:
#   location = /api/v1/auth/login {
#       limit_req zone=api_login burst=5 nodelay;
#       proxy_pass http://127.0.0.1:8000;
#   }
#   location /api/v1/ {
#       limit_req zone=api_all burst=40 nodelay;
#       limit_req_method POST zone=api_post burst=20 nodelay;  # ngx_http_limit_req: по методу — через map
#       proxy_pass http://127.0.0.1:8000;
#   }
#
# Примечание: ngx_http_limit_req не умеет фильтровать по методу напрямую —
# используйте map, который выделяет отдельную зону для POST:
#
#   map $request_method $api_zone {
#       default      "";
#       POST         $binary_remote_addr;
#   }
#   limit_req_zone $api_zone zone=api_post:10m rate=60r/m;
