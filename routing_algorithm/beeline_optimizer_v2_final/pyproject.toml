[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beeline-dispatch-optimizer"
version = "0.1.0"
description = "Research-informed technician routing, lexicographic route-pool optimization and scenario risk"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.13,<2", "numba>=0.61,<1"]

[project.optional-dependencies]
ml = ["pandas>=2.2,<3", "catboost>=1.2.8,<2", "pyarrow>=15"]
reference = ["ortools>=9.12,<10"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dispatch*"]
